worker_processes auto;

events {
    worker_connections 1024;
    use kqueue;  # macOS optimized
}

http {
    # ── Upstream: multiple Node.js instances for load balancing ──────────────
    # Run backend on ports 3001, 3002, 3003 for true concurrency
    upstream gymos_api {
        least_conn;                     # route to least-busy instance
        server 127.0.0.1:3001;
        server 127.0.0.1:3002 backup;  # spin up with PORT=3002 npm run dev
        server 127.0.0.1:3003 backup;  # spin up with PORT=3003 npm run dev
        keepalive 32;
    }

    # ── Rate limiting zones ────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # ── Connection limits ──────────────────────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # ── Logging ────────────────────────────────────────────────────────────
    access_log /opt/homebrew/var/log/nginx/gymos_access.log;
    error_log  /opt/homebrew/var/log/nginx/gymos_error.log warn;

    # ── Gzip compression ───────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_types application/json text/plain application/javascript text/css;

    server {
        listen 8080;
        server_name localhost;

        # ── Security headers ──────────────────────────────────────────────
        add_header X-Frame-Options          "DENY" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-XSS-Protection         "1; mode=block" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

        # ── API proxy ─────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_conn perip 20;

            proxy_pass         http://gymos_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ── Strict rate limit on login endpoint ───────────────────────────
        location /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            limit_req_status 429;

            proxy_pass         http://gymos_api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Health check ──────────────────────────────────────────────────
        location /health {
            proxy_pass http://gymos_api;
        }

        # ── Frontend (Vite dev server) ────────────────────────────────────
        location / {
            proxy_pass         http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
        }
    }
}
